<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVEC STUDIOS</title>
<meta name="description" content="AVEC STUDIOS. Contact info@avecstudios.io">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%229%22%20fill%3D%22%230E1116%22%2F%3E%3Cg%20transform%3D%22translate(8%2011.8)%20scale(.24)%22%3E%3Cpath%20d%3D%22M0%2082L32%200H68L100%2082H74L50%2020L26%2082Z%22%20fill%3D%22%23F3F2EE%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2250%22%20width%3D%2220%22%20height%3D%2220%22%20fill%3D%22%233346FF%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
/* Layout: one quiet screen, logo at the optical center, the address beneath it. Same structure as avec.io; Chevron logo. */
:root {
  --bg: #F3F2EE;
  --ink: #0E1116;
  --muted: #4B5160;
  --line: #D6D5CF;
  --accent: #3346FF;
  --sans: "Archivo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E1116; --ink: #F3F2EE; --muted: #8A90A0; --line: #2A2F3A; color-scheme: dark }
}
:root[data-theme="dark"] { --bg: #0E1116; --ink: #F3F2EE; --muted: #8A90A0; --line: #2A2F3A; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased }
/* Three rows: logo pinned near the top, contact in the true middle, an equal spacer below. */
main { min-height: 100%; display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; padding-inline: 24px; padding-block: clamp(32px, 7vh, 72px) }
h1 { margin: 0; align-self: start; font-weight: inherit; font-size: clamp(44px, 11vw, 88px) }
.lockup { display: flex; flex-direction: column; align-items: center; gap: .17em }
.word { display: flex; align-items: baseline; gap: .047em; font-weight: 800; line-height: 1; letter-spacing: .01em }
.word svg { width: .74em; height: .72em; flex: none }
.word .chev { fill: var(--ink) }
.word .dot { fill: var(--accent) }
.sub { font-size: max(.14em, 10px); font-weight: 600; letter-spacing: .5em; color: var(--muted); padding-left: .5em /* balances the trailing letter-space so it centers optically */ }
.contact { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.5vw, 22px); padding-block: 40px; text-align: center }
.contact p { margin: 0; font-size: clamp(36px, 8vw, 64px); font-weight: 800; line-height: 1.05; letter-spacing: -.01em; color: var(--ink) }
a.mail { font-size: clamp(16px, 2vw, 19px); letter-spacing: .04em; color: var(--muted); text-decoration: none; padding-block: 6px;
  border-bottom: 1px solid var(--line); transition: color .2s, border-color .2s }
a.mail:hover, a.mail:focus-visible { color: var(--ink); border-color: var(--accent); outline: none }
@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both }
  main > .contact { animation-delay: .25s }
  @keyframes rise { from { opacity: .001; transform: translateY(6px) } }
}
</style>
</head>
<body>
<main>
      <h1 aria-label="AVEC STUDIOS">
      <span class="lockup" aria-hidden="true">
        <span class="word"><svg viewBox="0 0 100 82" preserveAspectRatio="none"><path class="chev" d="M0 82L32 0H68L100 82H74L50 20L26 82Z"/><rect class="dot" x="43" y="52" width="14" height="14"/></svg><span>VEC</span></span>
        <span class="sub">STUDIOS</span>
      </span>
    </h1>
    <div class="contact">
      <p>Get in touch</p>
      <a class="mail" href="mailto:info@avecstudios.io">info@avecstudios.io</a>
    </div>
</main>
</body>
</html>
